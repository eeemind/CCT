
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CCT Game</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #111;
      color: white;
      margin: 0;
      padding: 0;
    }

    .container {
      margin-top: 20px;
      text-align: center;
      width: min(920px, 94vw);
      padding-bottom: 24px;
    }

    .settings {
      margin-top: 20px;
    }

    input,
    button,
    select {
      padding: 8px;
      margin: 5px;
      font-size: 16px;
    }

    #feedback {
      margin: 10px;
      min-height: 20px;
    }

    .dot {
      height: 12px;
      width: 12px;
      border-radius: 50%;
      display: inline-block;
      margin: 3px;
    }

    .green { background: lime; }
    .red { background: red; }

    .info { margin: 6px; }

    #intervalStats {
      margin: 10px 0 8px;
      font-size: 14px;
      color: #ccc;
      line-height: 1.35;
      min-height: 20px;
    }

    #topRightStat {
      position: fixed;
      top: 10px;
      right: 10px;
      font-size: 14px;
      color: #ccc;
      background: rgba(0, 0, 0, 0.22);
      padding: 6px 10px;
      border-radius: 8px;
      pointer-events: none;
    }

    #answerArea {
      margin-top: 6px;
      min-height: 58px;
    }

    #buttonAnswers {
      display: none;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      max-width: 620px;
      margin: 0 auto;
    }

    #buttonAnswers button {
      min-width: 52px;
      margin: 0;
    }

    #answer {
      width: 180px;
    }
    .footer { margin-top: 100px; }
  </style>
</head>
<body>
  <div id="topRightStat">Avg Today: --</div>

  <div class="container">
    <h1>Cognitive Control Training</h1>

    <div id="intervalStats"></div>

    <div class="info">Current Interval: <span id="currentInterval">1000</span> ms</div>
    <div class="info">Time Left: <span id="timeLeft">0</span>s</div>

    <div id="feedback"></div>

    <div id="answerArea">
      <input type="number" id="answer" placeholder="Enter sum" disabled />
      <div id="buttonAnswers"></div>
    </div>

    <div class="settings">
      Interval (ms): <input type="number" id="interval" value="1000" min="200" max="1000" step="100" /><br />
      Duration (minutes): <input type="number" id="duration" value="1" min="1" /><br />
      Gamemode:
      <select id="mode">
        <option value="normal">Normal</option>
        <option value="accuracy">High Accuracy</option>
      </select><br />
      <label><input type="checkbox" id="beepToggle" /> Beep on error</label><br />
      <label><input type="checkbox" id="buttonModeToggle" /> Use answer buttons</label>
    </div>

    <button id="startBtn">Start</button>
  </div>
<div class="footer">
<p>Note: interval may appear as double what it shows on other CCT tools</br>
beep might not work</br></p>
<a href="https://discord.gg/brain">Mindbuilding Discord</a>
</div>
<script>
  const STORAGE_KEY = "cctIntervalData";
  const startBtn = document.getElementById("startBtn");
  const answer = document.getElementById("answer");
  const intervalInput = document.getElementById("interval");
  const durationInput = document.getElementById("duration");
  const modeSelect = document.getElementById("mode");
  const beepToggle = document.getElementById("beepToggle");
  const buttonModeToggle = document.getElementById("buttonModeToggle");
  const currentIntervalEl = document.getElementById("currentInterval");
  const timeLeftEl = document.getElementById("timeLeft");
  const intervalStatsEl = document.getElementById("intervalStats");
  const buttonAnswersEl = document.getElementById("buttonAnswers");
  const topRightStatEl = document.getElementById("topRightStat");

  let interval = 1000;
  let startInterval = 1000;
  let numbers = [];
  let feedback = [];
  let correctStreak = 0;
  let wrongStreak = 0;
  let gameRunning = false;
  let timeoutId = null;
  let statsTickId = null;
  let endTime = 0;
  let awaitingAnswer = false;
  let mode = "normal";
  let beepEnabled = false;
  let buttonMode = false;

  let intervalCounts = {};
  let intervalTime = {};
  let statsDateKey = todayKey();
  let currentIntervalStart = 0;
  let currentIntervalSeen = false;

  function todayKey() {
    return new Date().toISOString().split("T")[0];
  }

  function ensureDailyReset() {
    const today = todayKey();
    if (today !== statsDateKey) {
      intervalCounts = {};
      intervalTime = {};
      statsDateKey = today;
      localStorage.removeItem(STORAGE_KEY);
    }
  }

  function loadDailyStats() {
    ensureDailyReset();
    const saved = localStorage.getItem(STORAGE_KEY);
    if (!saved) return;

    try {
      const parsed = JSON.parse(saved);
      if (parsed && parsed.date === statsDateKey) {
        intervalCounts = parsed.counts || {};
        intervalTime = parsed.times || {};
      } else {
        localStorage.removeItem(STORAGE_KEY);
      }
    } catch (err) {
      localStorage.removeItem(STORAGE_KEY);
    }
  }

  function persistDailyStats() {
    ensureDailyReset();
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      date: statsDateKey,
      counts: intervalCounts,
      times: intervalTime
    }));
  }

  function updateFeedbackUI() {
    const fb = document.getElementById("feedback");
    fb.innerHTML = "";
    feedback.slice(-4).forEach((f) => {
      const dot = document.createElement("span");
      dot.classList.add("dot", f ? "green" : "red");
      fb.appendChild(dot);
    });
  }

  function getThresholds() {
    return mode === "accuracy"
      ? { correct: 5, wrong: 3 }
      : { correct: 4, wrong: 4 };
  }

  function getQualifiedTimeForInterval(key, liveIntervalKey, liveElapsedMs) {
    const intervalMs = Number(key);
    const stored = intervalTime[key] || 0;
    if (gameRunning && Number(liveIntervalKey) === intervalMs) {
      if (intervalMs !== startInterval || currentIntervalSeen) {
        return stored + liveElapsedMs;
      }
    }
    return stored;
  }

  function renderDailyStats() {
    ensureDailyReset();

    const keys = Object.keys(intervalCounts)
      .map(Number)
      .sort((a, b) => b - a);

    const now = Date.now();
    const liveElapsed = gameRunning ? Math.max(0, now - currentIntervalStart) : 0;

    intervalStatsEl.innerHTML = "";

    let weightedSum = 0;
    let totalTime = 0;

    for (const key of keys) {
      const count = intervalCounts[key] || 0;
      if (count <= 0) continue;

      const timeMs = getQualifiedTimeForInterval(key, interval, liveElapsed);
      const displaySeconds = (timeMs / 1000).toFixed(1);

      const div = document.createElement("div");
      div.textContent = `${key}ms: ${count}   ${displaySeconds}s`;
      intervalStatsEl.appendChild(div);

      weightedSum += Number(key) * timeMs;
      totalTime += timeMs;
    }

    topRightStatEl.textContent = totalTime > 0
      ? `Avg Today: ${Math.round(weightedSum / totalTime)} ms`
      : `Avg Today: --`;
  }

  function speak(num) {
    if (!('speechSynthesis' in window)) return;
    try {
      const utter = new SpeechSynthesisUtterance(String(num));
      utter.rate = 1;
      utter.pitch = 1;
      utter.volume = 1;
      window.speechSynthesis.speak(utter);
    } catch (e) {
      // ignore speech errors
    }
  }

  function playBeep() {
    if (!beepEnabled) return;
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 1200;
      gain.gain.value = 0.1;
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.08);
    } catch (e) {
      // ignore audio errors
    }
  }

  function getRandomNumber() {
    return Math.floor(Math.random() * 9) + 1;
  }

  function buildAnswerButtons() {
    buttonAnswersEl.innerHTML = "";
    for (let i = 2; i <= 18; i++) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = i;
      btn.addEventListener("click", () => {
        if (!gameRunning) return;
        checkAnswer(i);
      });
      buttonAnswersEl.appendChild(btn);
    }
  }

  function updateAnswerModeUI() {
    if (buttonMode) {
      answer.style.display = "none";
      buttonAnswersEl.style.display = "flex";
    } else {
      answer.style.display = "inline-block";
      buttonAnswersEl.style.display = "none";
    }
  }

  function isCurrentIntervalCounted() {
    return interval !== startInterval || currentIntervalSeen;
  }

  function finalizeCurrentIntervalTime() {
    if (!gameRunning || currentIntervalStart === 0) return;
    const now = Date.now();
    const elapsed = Math.max(0, now - currentIntervalStart);
    if (isCurrentIntervalCounted()) {
      intervalTime[interval] = (intervalTime[interval] || 0) + elapsed;
    }
    currentIntervalStart = now;
  }

  function enterInterval(newInterval) {
    if (newInterval === interval) return;

    finalizeCurrentIntervalTime();
    if (interval === startInterval && newInterval !== startInterval) {
      currentIntervalSeen = true;
    }

    interval = newInterval;
    currentIntervalStart = Date.now();

    if (isCurrentIntervalCounted()) {
      intervalCounts[interval] = (intervalCounts[interval] || 0) + 1;
    }

    currentIntervalEl.textContent = interval;
    persistDailyStats();
    renderDailyStats();
  }

  function adjustDifficulty() {
    const thresholds = getThresholds();

    if (correctStreak >= thresholds.correct) {
      correctStreak = 0;
      enterInterval(Math.max(200, interval - 100));
    }

    if (wrongStreak >= thresholds.wrong) {
      wrongStreak = 0;
      enterInterval(Math.min(1000, interval + 100));
    }
  }

  function registerWrong() {
    feedback.push(false);
    wrongStreak += 1;
    correctStreak = 0;
    answer.value = "";
    playBeep();
    updateFeedbackUI();
    adjustDifficulty();
  }

  function getCorrectSum() {
    if (numbers.length < 2) return null;
    return numbers[numbers.length - 1] + numbers[numbers.length - 2];
  }

  function checkAnswer(value) {
    if (!awaitingAnswer || numbers.length < 2) return;

    const correct = getCorrectSum();
    if (correct === null) return;

    if (Number(value) === correct) {
      feedback.push(true);
      correctStreak += 1;
      wrongStreak = 0;
      awaitingAnswer = false;
      answer.value = "";
      updateFeedbackUI();
      adjustDifficulty();
    } else {
      feedback.push(false);
      wrongStreak += 1;
      correctStreak = 0;
      answer.value = "";
      playBeep();
      updateFeedbackUI();
      adjustDifficulty();
    }

    persistDailyStats();
  }

  function gameLoop() {
    if (!gameRunning) return;

    if (awaitingAnswer && numbers.length >= 2) {
      registerWrong();
    }

    const num = getRandomNumber();
    numbers.push(num);
    speak(num);
    awaitingAnswer = true;

    timeoutId = setTimeout(gameLoop, interval);
  }

  function updateTimer() {
    if (!gameRunning) return;
    const remaining = Math.max(0, Math.floor((endTime - Date.now()) / 1000));
    timeLeftEl.textContent = remaining;
    if (remaining <= 0) {
      stopGame();
    } else {
      requestAnimationFrame(updateTimer);
    }
  }

  function statsTicker() {
    if (!gameRunning) return;
    renderDailyStats();
    statsTickId = window.setTimeout(statsTicker, 250);
  }

  function startGame() {
    ensureDailyReset();

    if (timeoutId) clearTimeout(timeoutId);
    if (statsTickId) clearTimeout(statsTickId);

    interval = parseInt(intervalInput.value, 10);
    startInterval = interval;
    const duration = parseInt(durationInput.value, 10) * 60000;
    mode = modeSelect.value;
    beepEnabled = beepToggle.checked;
    buttonMode = buttonModeToggle.checked;

    numbers = [];
    feedback = [];
    correctStreak = 0;
    wrongStreak = 0;
    awaitingAnswer = false;

    gameRunning = true;
    endTime = Date.now() + duration;
    currentIntervalStart = Date.now();
    currentIntervalSeen = false;

    answer.disabled = false;
    answer.value = "";
    answer.focus();

    currentIntervalEl.textContent = interval;
    updateFeedbackUI();
    updateAnswerModeUI();

    renderDailyStats();
    updateTimer();
    statsTicker();

    timeoutId = setTimeout(gameLoop, 100);
    persistDailyStats();
  }

  function stopGame() {
    if (!gameRunning) return;

    gameRunning = false;
    clearTimeout(timeoutId);
    if (statsTickId) clearTimeout(statsTickId);

    finalizeCurrentIntervalTime();
    persistDailyStats();
    renderDailyStats();

    answer.disabled = true;
    timeLeftEl.textContent = "0";
  }

  function checkInputLive() {
    if (!gameRunning || buttonMode) return;
    if (!awaitingAnswer || numbers.length < 2) return;

    const raw = answer.value.trim();
    if (raw === "") return;

    const correct = getCorrectSum();
    if (correct === null) return;

    if (raw === String(correct)) {
      checkAnswer(Number(raw));
    }
  }

  buttonModeToggle.addEventListener("change", (e) => {
    buttonMode = e.target.checked;
    updateAnswerModeUI();
  });

  startBtn.addEventListener("click", startGame);
  answer.addEventListener("input", checkInputLive);

  buildAnswerButtons();
  loadDailyStats();
  renderDailyStats();
  updateAnswerModeUI();
</script>
</body>
</html>
