<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CCT Game</title>
<style>
  body {
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: #111;
    color: white;
    margin: 0;
    padding: 0;
  }

  .container {
    margin-top: 20px;
    text-align: center;
    width: min(900px, 94vw);
    padding-bottom: 24px;
  }

  .settings {
    margin-top: 20px;
  }

  input, button, select {
    padding: 8px;
    margin: 5px;
    font-size: 16px;
  }

  #feedback {
    margin: 10px;
    min-height: 20px;
  }

  .dot {
    height: 12px;
    width: 12px;
    border-radius: 50%;
    display: inline-block;
    margin: 3px;
  }

  .green { background: lime; }
  .red { background: red; }

  .info { margin: 6px; }

  #intervalStats {
    margin: 10px 0 6px;
    font-size: 14px;
    color: #ccc;
    line-height: 1.35;
  }

  #topRightStat {
    position: fixed;
    top: 10px;
    right: 10px;
    font-size: 14px;
    color: #ccc;
    background: rgba(0, 0, 0, 0.2);
    padding: 6px 10px;
    border-radius: 8px;
  }

  #answerArea {
    margin-top: 6px;
    min-height: 58px;
  }

  #buttonAnswers {
    display: none;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
    max-width: 620px;
    margin: 0 auto;
  }

  #buttonAnswers button {
    min-width: 52px;
    margin: 0;
  }

  #answer {
    width: 180px;
  }
  .footer { margin-top: 100px; }
</style>
</head>
<body>
  <div id="topRightStat">Avg Today: --</div>

  <div class="container">
    <h1>Cognitive Control Training</h1>

    <div id="intervalStats"></div>

    <div class="info">Current Interval: <span id="currentInterval">1000</span> ms</div>
    <div class="info">Time Left: <span id="timeLeft">0</span>s</div>

    <div id="feedback"></div>

    <div id="answerArea">
      <input type="number" id="answer" placeholder="Enter sum" disabled />
      <div id="buttonAnswers"></div>
    </div>

    <div class="settings">
      Interval (ms): <input type="number" id="interval" value="1000" min="200" max="1000" step="100" /><br />
      Duration (minutes): <input type="number" id="duration" value="1" min="1" /><br />
      Gamemode:
      <select id="mode">
        <option value="normal">Normal</option>
        <option value="accuracy">High Accuracy</option>
      </select><br />
      <label><input type="checkbox" id="beepToggle" /> Beep on error</label><br />
      <label><input type="checkbox" id="buttonModeToggle" /> Use answer buttons</label>
    </div>

    <button id="startBtn">Start</button>
  </div>
<div class="footer">
<p>Note: interval may appear as double what it shows on other CCT tools</br>
beep might not work</br></p>
<a href="https://discord.gg/brain">Mindbuilding Discord</a>
</div>
<script>
let interval = 1000;
let startInterval = 1000;
let numbers = [];
let feedback = [];
let correctStreak = 0;
let wrongStreak = 0;
let gameRunning = false;
let timeoutId = null;
let endTime = 0;
let awaitingAnswer = false;
let mode = "normal";
let beepEnabled = false;
let buttonMode = false;

let intervalCounts = {};
let intervalTime = {};
let currentIntervalStart = 0;
let statsDateKey = todayKey();
let rafTimer = null;

const startBtn = document.getElementById("startBtn");
const answer = document.getElementById("answer");
const intervalInput = document.getElementById("interval");
const durationInput = document.getElementById("duration");
const modeSelect = document.getElementById("mode");
const beepToggle = document.getElementById("beepToggle");
const buttonModeToggle = document.getElementById("buttonModeToggle");
const currentIntervalEl = document.getElementById("currentInterval");
const timeLeftEl = document.getElementById("timeLeft");
const intervalStatsEl = document.getElementById("intervalStats");
const buttonAnswersEl = document.getElementById("buttonAnswers");
const topRightStatEl = document.getElementById("topRightStat");

function todayKey() {
  return new Date().toISOString().split('T')[0];
}

function ensureDailyReset() {
  const today = todayKey();
  if (today !== statsDateKey) {
    intervalCounts = {};
    intervalTime = {};
    statsDateKey = today;
    localStorage.removeItem("cctIntervalData");
  }
}

function saveDailyStats() {
  ensureDailyReset();
  localStorage.setItem("cctIntervalData", JSON.stringify({
    date: statsDateKey,
    counts: intervalCounts,
    times: intervalTime
  }));
}

function loadDailyStats() {
  const saved = localStorage.getItem("cctIntervalData");
  if (!saved) return;

  try {
    const parsed = JSON.parse(saved);
    const today = todayKey();
    if (parsed && parsed.date === today) {
      intervalCounts = parsed.counts || {};
      intervalTime = parsed.times || {};
      statsDateKey = today;
    } else {
      localStorage.removeItem("cctIntervalData");
    }
  } catch (err) {
    localStorage.removeItem("cctIntervalData");
  }
}

function updateFeedbackUI() {
  const fb = document.getElementById("feedback");
  fb.innerHTML = "";
  feedback.slice(-4).forEach(f => {
    const dot = document.createElement("span");
    dot.classList.add("dot", f ? "green" : "red");
    fb.appendChild(dot);
  });
}

function updateIntervalStats() {
  const keys = Object.keys(intervalCounts)
    .map(Number)
    .sort((a, b) => b - a);

  intervalStatsEl.innerHTML = "";
  keys.forEach(k => {
    const div = document.createElement("div");
    const count = intervalCounts[k] || 0;
    const timeSeconds = (intervalTime[k] || 0) / 1000;
    div.textContent = `${k}ms: ${count}   ${timeSeconds.toFixed(1)}s`;
    intervalStatsEl.appendChild(div);
  });

  updateAverageIntervalToday();
  saveDailyStats();
}

function updateAverageIntervalToday() {
  let weightedSum = 0;
  let totalTime = 0;

  for (const key of Object.keys(intervalTime)) {
    const intervalMs = Number(key);
    const timeMs = intervalTime[key] || 0;
    weightedSum += intervalMs * timeMs;
    totalTime += timeMs;
  }

  const avg = totalTime > 0 ? weightedSum / totalTime : 0;
  topRightStatEl.textContent = totalTime > 0 ? `Avg Today: ${avg.toFixed(0)} ms` : `Avg Today: --`;
}

function getRandomNumber() {
  return Math.floor(Math.random() * 9) + 1;
}

function speak(num) {
  if (!('speechSynthesis' in window)) return;
  try {
    const utter = new SpeechSynthesisUtterance(String(num));
    utter.rate = 1;
    utter.pitch = 1;
    utter.volume = 1;
    window.speechSynthesis.speak(utter);
  } catch (e) {
    // silently ignore speech errors
  }
}

function playBeep() {
  if (!beepEnabled) return;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = 1200;
    gain.gain.value = 0.1;
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.08);
  } catch (e) {
    // ignore audio errors
  }
}

function getThresholds() {
  return mode === "accuracy" ? { correct: 5, wrong: 3 } : { correct: 4, wrong: 4 };
}

function refreshCurrentIntervalTime() {
  if (!gameRunning) return;

  const now = Date.now();
  const elapsed = now - currentIntervalStart;

  if (interval !== startInterval || (intervalCounts[interval] && intervalCounts[interval] > 0)) {
    intervalTime[interval] = (intervalTime[interval] || 0) + elapsed;
  }

  currentIntervalStart = now;
  updateIntervalStats();
  rafTimer = requestAnimationFrame(refreshCurrentIntervalTime);
}

function commitIntervalTime() {
  const now = Date.now();
  const elapsed = Math.max(0, now - currentIntervalStart);
  if (interval !== startInterval || (intervalCounts[interval] && intervalCounts[interval] > 0)) {
    intervalTime[interval] = (intervalTime[interval] || 0) + elapsed;
  }
  currentIntervalStart = now;
}

function changeInterval(newInterval) {
  if (newInterval === interval) return;

  commitIntervalTime();
  interval = newInterval;
  currentIntervalStart = Date.now();

  if (interval !== startInterval || (intervalCounts[interval] && intervalCounts[interval] > 0)) {
    intervalCounts[interval] = (intervalCounts[interval] || 0) + 1;
  }

  currentIntervalEl.textContent = interval;
  updateIntervalStats();
}

function adjustDifficulty() {
  const thresholds = getThresholds();

  if (correctStreak >= thresholds.correct) {
    correctStreak = 0;
    changeInterval(Math.max(200, interval - 100));
  }

  if (wrongStreak >= thresholds.wrong) {
    wrongStreak = 0;
    changeInterval(Math.min(1000, interval + 100));
  }
}

function registerWrong() {
  feedback.push(false);
  wrongStreak++;
  correctStreak = 0;
  answer.value = "";
  playBeep();
  updateFeedbackUI();
  adjustDifficulty();
}

function getCorrectSum() {
  if (numbers.length < 2) return null;
  return numbers[numbers.length - 1] + numbers[numbers.length - 2];
}

function checkAnswer(value) {
  if (!awaitingAnswer || numbers.length < 2) return;

  const correct = getCorrectSum();
  if (correct === null) return;

  if (Number(value) === correct) {
    feedback.push(true);
    correctStreak++;
    wrongStreak = 0;
    awaitingAnswer = false;
    answer.value = "";
    updateFeedbackUI();
    adjustDifficulty();
  } else {
    feedback.push(false);
    wrongStreak++;
    correctStreak = 0;
    answer.value = "";
    playBeep();
    updateFeedbackUI();
    adjustDifficulty();
  }
}

function gameLoop() {
  if (!gameRunning) return;

  if (awaitingAnswer && numbers.length >= 2) {
    registerWrong();
  }

  const num = getRandomNumber();
  numbers.push(num);
  speak(num);
  awaitingAnswer = true;

  timeoutId = setTimeout(gameLoop, interval);
}

function updateTimer() {
  if (!gameRunning) return;
  const remaining = Math.max(0, Math.floor((endTime - Date.now()) / 1000));
  timeLeftEl.textContent = remaining;
  if (remaining <= 0) {
    stopGame();
  } else {
    requestAnimationFrame(updateTimer);
  }
}

function buildAnswerButtons() {
  buttonAnswersEl.innerHTML = "";
  for (let i = 2; i <= 18; i++) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = i;
    btn.addEventListener("click", () => {
      checkAnswer(i);
    });
    buttonAnswersEl.appendChild(btn);
  }
}

function updateAnswerModeUI() {
  if (buttonMode) {
    answer.style.display = "none";
    buttonAnswersEl.style.display = "flex";
  } else {
    answer.style.display = "inline-block";
    buttonAnswersEl.style.display = "none";
  }
}

function startGame() {
  ensureDailyReset();
  interval = parseInt(intervalInput.value, 10);
  startInterval = interval;
  const duration = parseInt(durationInput.value, 10) * 60000;
  mode = modeSelect.value;
  beepEnabled = beepToggle.checked;
  buttonMode = buttonModeToggle.checked;

  numbers = [];
  feedback = [];
  correctStreak = 0;
  wrongStreak = 0;
  awaitingAnswer = false;
  intervalCounts = intervalCounts || {};
  intervalTime = intervalTime || {};

  gameRunning = true;
  endTime = Date.now() + duration;
  currentIntervalStart = Date.now();

  answer.disabled = false;
  answer.value = "";
  answer.focus();

  currentIntervalEl.textContent = interval;
  updateFeedbackUI();
  updateAnswerModeUI();

  updateIntervalStats();
  updateAverageIntervalToday();

  if (rafTimer) cancelAnimationFrame(rafTimer);

  setTimeout(() => {
    gameLoop();
    updateTimer();
    refreshCurrentIntervalTime();
  }, 100);
}

function stopGame() {
  gameRunning = false;
  clearTimeout(timeoutId);
  if (rafTimer) cancelAnimationFrame(rafTimer);
  commitIntervalTime();
  updateIntervalStats();
  answer.disabled = true;
  timeLeftEl.textContent = "0";
}

function checkInputLive() {
  if (!awaitingAnswer || numbers.length < 2) return;
  if (buttonMode) return;
  const val = parseInt(answer.value, 10);
  if (!Number.isNaN(val)) {
    checkAnswer(val);
  }
}

buttonModeToggle.addEventListener("change", (e) => {
  buttonMode = e.target.checked;
  updateAnswerModeUI();
});

startBtn.addEventListener("click", startGame);
answer.addEventListener("input", checkInputLive);

buildAnswerButtons();
loadDailyStats();
updateAverageIntervalToday();
updateAnswerModeUI();
</script>
</body>
</html>
